name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep iphonesimulator

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS Simulator
        run: xcodebuild -project AIOBS-iOS.xcodeproj -scheme AIOBS-iOS -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -arch arm64 ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build